version: 2.1
jobs:
  validate:
    docker: &id002
    - image: node:22.23.4-bookworm@sha256:18a6d90fd60542269850c80ca03b29b1d9b14d6b221ac7ee8e35b0d33ef904bd
    resource_class: xlarge
    environment: &id003
      NODE_OPTIONS: --max-old-space-size=8192
      YARN_CACHE_FOLDER: /tmp/yarn-cache
    steps:
    - checkout
    - &id001
      run:
        name: Verify deployment helpers v2.0.9
        command: 'set -euo pipefail

          git init --quiet /tmp/tc-deploy-scripts

          git -C /tmp/tc-deploy-scripts remote add origin https://github.com/topcoder-platform/tc-deploy-scripts.git

          git -C /tmp/tc-deploy-scripts fetch --quiet --depth 1 origin refs/tags/v2.0.9

          git -C /tmp/tc-deploy-scripts checkout --quiet --detach FETCH_HEAD

          test "$(git -C /tmp/tc-deploy-scripts rev-parse HEAD)" = dc06de730f068a230efa9d5f4d4d9c80782d3bfb

          '
    - &id005
      restore_cache:
        keys:
        - platform-ui-yarn-v1-{{ arch }}-{{ checksum "yarn.lock" }}
    - &id006
      run:
        name: Install locked dependencies
        command: 'test "$(node --version)" = v22.23.4

          test "$(yarn --version)" = 1.22.22

          yarn install --frozen-lockfile --non-interactive'
        no_output_timeout: 15m
    - &id007
      save_cache:
        key: platform-ui-yarn-v1-{{ arch }}-{{ checksum "yarn.lock" }}
        paths:
        - /tmp/yarn-cache
    - run:
        name: Validate deployment boundaries and application
        command: 'python3 -m unittest discover -s deploy/tests -v

          yarn lint

          CI=true yarn test:no-watch --runInBand --watch=false --runTestsByPath src/libs/cms/cms.client.spec.ts
          src/config/environments/react-env.spec.ts

          '
        no_output_timeout: 20m
  prepare-config:
    docker:
    - image: cimg/aws@sha256:4cf3768db00ddf9bc439b8c84e8a60c11a14edf81c8baf76f74132144f8340d5
    parameters: &id004
      environment:
        type: enum
        enum:
        - dev
        - prod
    steps:
    - checkout
    - *id001
    - run:
        name: Verify streaming S3 commands with the pinned AWS CLI
        command: python3 -m unittest discover -s deploy/tests -p test_aws_cli.py -v
    - run:
        name: Fetch pinned browser configuration using read-only OIDC
        command: python3 -I deploy/site.py config --manifest deploy/<< parameters.environment >>.json
    - persist_to_workspace:
        root: /tmp/release
        paths:
        - browser-config.json
  build:
    docker: *id002
    resource_class: xlarge
    environment: *id003
    parameters: *id004
    steps:
    - checkout
    - *id001
    - *id005
    - *id006
    - *id007
    - attach_workspace:
        at: /tmp/release
    - run:
        name: Build without AWS credentials and record artifact provenance
        command: python3 -I deploy/site.py build --manifest deploy/<< parameters.environment >>.json
        no_output_timeout: 45m
    - run: cp -a build /tmp/release/build
    - persist_to_workspace:
        root: /tmp/release
        paths:
        - build
        - artifact.json
  deploy:
    docker:
    - image: cimg/aws@sha256:4cf3768db00ddf9bc439b8c84e8a60c11a14edf81c8baf76f74132144f8340d5
    parameters: *id004
    steps:
    - checkout
    - *id001
    - attach_workspace:
        at: /tmp/release
    - run:
        name: Publish verified assets, promote HTML, and verify CloudFront
        command: python3 -I deploy/site.py deploy --manifest deploy/<< parameters.environment >>.json
        no_output_timeout: 45m
    - store_artifacts:
        path: /tmp/release/deployment-receipt.json
workflows:
  release:
    jobs:
    - validate
    - prepare-config:
        name: config-dev
        environment: dev
        requires:
        - validate
        context: platform-ui-dev-build
        filters: &id008
          branches:
            only: dev
          tags:
            ignore: /.*/
    - build:
        name: build-dev
        environment: dev
        requires:
        - config-dev
        filters: *id008
    - deploy:
        name: deploy-dev
        environment: dev
        requires:
        - build-dev
        context: platform-ui-dev-deploy
        serial-group: << pipeline.project.slug >>/deploy-dev
        filters: *id008
    - prepare-config:
        name: config-prod
        environment: prod
        requires:
        - validate
        context: platform-ui-prod-build
        filters: &id009
          branches:
            only: master
          tags:
            ignore: /.*/
    - build:
        name: build-prod
        environment: prod
        requires:
        - config-prod
        filters: *id009
    - approve-prod:
        type: approval
        requires:
        - build-prod
        filters: *id009
    - deploy:
        name: deploy-prod
        environment: prod
        requires:
        - approve-prod
        context: platform-ui-prod-deploy
        serial-group: << pipeline.project.slug >>/deploy-prod
        filters: *id009
