name: Mirror GitHub to AWS CodeCommit

on:
    push:
        branches:
            - '**'
        tags:
            - '**'
    schedule:
        - cron: '17 */6 * * *'
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

concurrency:
    group: codecommit-mirror-${{ github.repository }}
    cancel-in-progress: false

jobs:
    mirror:
        name: Synchronize Git refs
        if: ${{ vars.CODECOMMIT_MIRROR_ENABLED == 'true' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        env:
            MIRROR_AWS_REGION: ${{ vars.CODECOMMIT_MIRROR_AWS_REGION }}
            MIRROR_REPOSITORY: ${{ vars.CODECOMMIT_MIRROR_REPOSITORY }}
            MIRROR_ROLE_ARN: ${{ vars.CODECOMMIT_MIRROR_ROLE_ARN }}
            SOURCE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

        steps:
            - name: Validate mirror configuration
              shell: bash
              run: |
                  set -euo pipefail

                  configuration_is_valid=true

                  if [[ -z "${MIRROR_AWS_REGION}" ]]; then
                    echo "::error::Repository variable CODECOMMIT_MIRROR_AWS_REGION is not configured."
                    configuration_is_valid=false
                  fi

                  if [[ -z "${MIRROR_REPOSITORY}" ]]; then
                    echo "::error::Repository variable CODECOMMIT_MIRROR_REPOSITORY is not configured."
                    configuration_is_valid=false
                  fi

                  if [[ -z "${MIRROR_ROLE_ARN}" ]]; then
                    echo "::error::Repository variable CODECOMMIT_MIRROR_ROLE_ARN is not configured."
                    configuration_is_valid=false
                  fi

                  if [[ -z "${SOURCE_DEFAULT_BRANCH}" ]]; then
                    echo "::error::The GitHub event did not identify the repository's default branch."
                    configuration_is_valid=false
                  fi

                  if [[ "${configuration_is_valid}" != "true" ]]; then
                    exit 1
                  fi

                  if [[ ! "${MIRROR_AWS_REGION}" =~ ^[a-z]{2}(-[a-z0-9]+)+-[0-9]+$ ]]; then
                    echo "::error::CODECOMMIT_MIRROR_AWS_REGION is not a valid AWS Region name."
                    exit 1
                  fi

                  if [[ ! "${MIRROR_REPOSITORY}" =~ ^[A-Za-z0-9._-]{1,100}$ ]]; then
                    echo "::error::CODECOMMIT_MIRROR_REPOSITORY is not a valid CodeCommit repository name."
                    exit 1
                  fi

                  if [[ ! "${MIRROR_ROLE_ARN}" =~ ^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/.+$ ]]; then
                    echo "::error::CODECOMMIT_MIRROR_ROLE_ARN is not a valid IAM role ARN."
                    exit 1
                  fi

            - name: Check out every branch and tag
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ env.SOURCE_DEFAULT_BRANCH }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Configure short-lived AWS credentials
              uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
              with:
                  role-to-assume: ${{ env.MIRROR_ROLE_ARN }}
                  aws-region: ${{ env.MIRROR_AWS_REGION }}
                  role-session-name: GitHubActions-platform-ui-mirror

            - name: Synchronize branches, tags, and the default branch
              shell: bash
              run: |
                  set -euo pipefail

                  codecommit_url="https://git-codecommit.${MIRROR_AWS_REGION}.amazonaws.com/v1/repos/${MIRROR_REPOSITORY}"
                  git remote add codecommit "${codecommit_url}"
                  git config --local credential.helper '!aws codecommit credential-helper $@'
                  git config --local credential.UseHttpPath true

                  while read -r object_name remote_ref; do
                    if [[ "${remote_ref}" == "refs/remotes/origin/HEAD" ]]; then
                      continue
                    fi

                    branch_name="${remote_ref#refs/remotes/origin/}"
                    git update-ref "refs/heads/${branch_name}" "${object_name}"
                  done < <(git for-each-ref --format='%(objectname) %(refname)' refs/remotes/origin)

                  # Create/update source refs first so the GitHub default branch exists in CodeCommit.
                  git push --force codecommit \
                    'refs/heads/*:refs/heads/*' \
                    'refs/tags/*:refs/tags/*'

                  aws codecommit update-default-branch \
                    --region "${MIRROR_AWS_REGION}" \
                    --repository-name "${MIRROR_REPOSITORY}" \
                    --default-branch-name "${SOURCE_DEFAULT_BRANCH}"

                  # Prune only branches and tags; provider-specific internal refs are left untouched.
                  git push --force --prune codecommit \
                    'refs/heads/*:refs/heads/*' \
                    'refs/tags/*:refs/tags/*'

            - name: Verify mirrored ref object IDs
              shell: bash
              run: |
                  set -euo pipefail

                  source_refs="${RUNNER_TEMP}/platform-ui-source-refs"
                  destination_refs="${RUNNER_TEMP}/platform-ui-codecommit-refs"

                  git for-each-ref --format='%(objectname) %(refname)' refs/heads refs/tags \
                    | sort > "${source_refs}"
                  git ls-remote --refs codecommit 'refs/heads/*' 'refs/tags/*' \
                    | awk '{ print $1, $2 }' \
                    | sort > "${destination_refs}"

                  diff -u "${source_refs}" "${destination_refs}"
